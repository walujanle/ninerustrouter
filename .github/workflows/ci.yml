name: CI

# Gate every push and pull request on the same checks a release depends on:
# formatting, lints, tests and the frontend build. The release workflow only
# runs on a tag, so without this a broken commit can sit on the branch until a
# release is attempted.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned to match rust-toolchain.toml, so CI does not float on `stable`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # aws-lc-sys (the rustls backend) compiles C and assembly with cmake.
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - name: Assert every manifest agrees with PROJECT_VERSION
        run: node scripts/set-version.mjs --check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The declared floor (`rust-version` in Cargo.toml, 1.88) is otherwise never
  # exercised: every other job pins 1.97.1. `check` is enough to catch an MSRV
  # break without a second full build.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      # `+1.88.0` overrides `rust-toolchain.toml` (which pins 1.97.1).
      - run: cargo +1.88.0 check --workspace

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # `npm run build` is vue-tsc -b, then biome check, then vite build.
      - run: npm run build
        working-directory: web
      # `npm run build` runs `biome check`, which reports but tolerates some
      # diagnostics. `biome ci` is the strict form and is the documented gate.
      # Call the local binary: `npx biome ci` resolves `ci` as a package name.
      - run: ./node_modules/.bin/biome ci
        working-directory: web
      - run: npm test
        working-directory: web

  # A published advisory is a real blocking condition for a repository whose
  # only ongoing work is dependency updates, so this job fails the build. When
  # an advisory has no fix yet, add it to `--ignore` here with a one-line reason
  # rather than turning the job back into a warning: an ignored advisory is
  # visible in the diff, a red job nobody reads is not.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --audit-level=high
        working-directory: web
